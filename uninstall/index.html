<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Help Improve Screener Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css?v=3">
</head>
<body>
  <div class="aurora"></div>
  <main class="container feedback-page">
    <section class="feedback-card">
      <a class="brand" href="../">Screener <em>Pro</em></a>
      <img src="../store-assets/icon_128.png" alt="Screener Pro icon" style="display:block; width:64px; height:64px; border-radius:16px; margin:32px auto 0; box-shadow:0 4px 20px rgba(0,0,0,0.35);">
      <h1>Help us make the next version better.</h1>
      <p>Sorry to see you go. Tell us what happened, what broke, or what you'd love to see — it lands straight in our inbox.</p>
      <form id="feedback-form" class="feedback-form">
        <input type="text" name="name" placeholder="Your name (optional)" autocomplete="name">
        <input type="email" name="email" placeholder="Your email (optional, if you'd like a reply)" autocomplete="email">
        <textarea name="message" rows="5" required placeholder="Write your feedback here…"></textarea>
        <input type="file" id="feedback-files" class="file-hidden" name="attachment" accept="image/*" multiple>
        <label class="attach-drop" for="feedback-files" id="attach-drop">
          <span class="attach-drop-title">📎 Attach screenshots or photos</span>
          <span class="attach-drop-sub">Click to browse or drag &amp; drop here · images only, max 10MB total</span>
          <span class="attach-drop-files" id="attach-file-names">No file chosen</span>
        </label>
        <div id="attach-preview" class="attach-preview"></div>
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
        <button class="button button-primary" type="submit" id="feedback-submit">Send feedback</button>
        <p id="feedback-status" class="feedback-note" role="status"></p>
      </form>
      <p class="feedback-note"><a href="../">Return to Screener Pro</a></p>
    </section>
  </main>
  <div id="confirm-dialog" class="confirm-overlay" style="display:none" role="alertdialog" aria-label="Feedback sent">
    <div class="confirm-box">
      <div class="confirm-check">✓</div>
      <h3>Feedback sent!</h3>
      <p>Thanks — we read every message.</p>
    </div>
  </div>
  <script>
    (() => {
      const form = document.getElementById('feedback-form');
      const status = document.getElementById('feedback-status');
      const submit = document.getElementById('feedback-submit');
      const dialog = document.getElementById('confirm-dialog');
      let hideTimer = null;
      function showDialog() {
        dialog.style.display = 'flex';
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(hideDialog, 5000);
      }
      function hideDialog() {
        dialog.style.display = 'none';
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      }
      dialog.addEventListener('click', hideDialog);
      const fileInput = document.getElementById('feedback-files');
      const previewBox = document.getElementById('attach-preview');
      const dropZone = document.getElementById('attach-drop');
      const fileNames = document.getElementById('attach-file-names');
      function refreshAttachments() {
        const list = Array.from(fileInput.files || []);
        previewBox.innerHTML = '';
        fileNames.textContent = list.length
          ? list.length + ' file' + (list.length > 1 ? 's' : '') + ': ' + list.map((f) => f.name).join(', ')
          : 'No file chosen';
        list.forEach((f) => {
          if (!f.type.startsWith('image/')) return;
          const img = document.createElement('img');
          img.alt = f.name;
          img.src = URL.createObjectURL(f);
          img.onload = () => URL.revokeObjectURL(img.src);
          previewBox.appendChild(img);
        });
      }
      fileInput.addEventListener('change', refreshAttachments);
      ['dragenter', 'dragover'].forEach((ev) => dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      }));
      ['dragleave', 'drop'].forEach((ev) => dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
      }));
      dropZone.addEventListener('drop', (e) => {
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          refreshAttachments();
        }
      });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.textContent = 'Sending…';
        submit.disabled = true;
        submit.style.opacity = '.6';
        const fields = {
          name: form.elements.name.value.trim(),
          email: form.elements.email.value.trim(),
          message: form.elements.message.value.trim()
        };
        const files = Array.from(form.elements.attachment.files || []);
        const MAX_TOTAL = 10 * 1024 * 1024;
        if (files.some((f) => !f.type.startsWith('image/'))) {
          status.textContent = 'Only image files (photos, screenshots) can be attached.';
          submit.disabled = false;
          submit.style.opacity = '';
          return;
        }
        if (files.reduce((s, f) => s + f.size, 0) > MAX_TOTAL) {
          status.textContent = 'Attachments exceed 10MB in total. Please remove some files.';
          submit.disabled = false;
          submit.style.opacity = '';
          return;
        }
        try {
          const data = new FormData();
          data.append('name', fields.name);
          data.append('email', fields.email);
          data.append('message', fields.message);
          files.forEach((f) => data.append('attachment', f, f.name));
          data.append('_subject', 'Screener Pro feedback');
          data.append('_template', 'table');
          data.append('_captcha', 'false');
          const r = await fetch('https://formsubmit.co/ajax/vishwaroopg8@gmail.com', {
            method: 'POST',
            headers: { 'Accept': 'application/json' },
            body: data
          });
          if (!r.ok) throw new Error('send failed');
          form.reset();
          previewBox.innerHTML = '';
          fileNames.textContent = 'No file chosen';
          status.textContent = '';
          submit.disabled = false;
          submit.style.opacity = '';
          showDialog();
        } catch (err) {
          const mailto = 'mailto:vishwaroopg8@gmail.com?subject='
            + encodeURIComponent('Screener Pro feedback')
            + '&body=' + encodeURIComponent((fields.name ? 'Name: ' + fields.name + '\n' : '')
              + (fields.email ? 'Email: ' + fields.email + '\n' : '') + '\n' + fields.message);
          status.innerHTML = 'Automatic send failed (attachments need automatic send). <a href="' + mailto + '">Click here to send the text via your email app instead</a>.';
          submit.disabled = false;
          submit.style.opacity = '';
        }
      });
    })();
  </script>
</body>
</html>
