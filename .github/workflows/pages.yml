name: Deploy website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'site.css'
      - 'site.js'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'market-holidays.json'
      - 'blog/**'
      - 'collections/**'
      - 'glossary/**'
      - 'learn/**'
      - 'store-assets/**'
      - 'uninstall/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: manual-website-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python editorial/pipeline.py pack-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/editorial-site
      - id: deployment
        uses: actions/deploy-pages@v4
