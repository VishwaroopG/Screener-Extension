name: Editorial checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'editorial/**'
      - '.github/workflows/editorial*.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editorial/package-lock.json
      - run: python -m unittest discover -s editorial/test -p 'test_*.py' -v
      - run: node --test editorial/test/worker.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: editorial
      - run: npx --no-install wrangler deploy --dry-run --outdir .wrangler/build
        working-directory: editorial
      - name: Check current official feed availability
        continue-on-error: true
        run: python editorial/pipeline.py check-feeds
